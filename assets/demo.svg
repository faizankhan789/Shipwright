<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-label="Terminal demo: Shipwright refuses to finish a bug fix until a failing test and a root-cause hypothesis are recorded, then accepts it.">
  <style>
    .bg{fill:#0a0f1e}.bar{fill:#141b2e}
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:14px;fill:#c9d3e8}
    .title{fill:#7f8db0;font-size:12px}.cmd{fill:#fff}.dim{fill:#7f8db0}.bad{fill:#ff7b7b}.good{fill:#5fe0a6}.warn{fill:#f4b860}
    .l{opacity:0}
    @keyframes k0{0%,1.54%{opacity:0}2.04%,94%{opacity:1}97%,100%{opacity:0}}.k0{animation:k0 26s linear infinite}@keyframes k1{0%,6.92%{opacity:0}7.42%,94%{opacity:1}97%,100%{opacity:0}}.k1{animation:k1 26s linear infinite}@keyframes k2{0%,13.08%{opacity:0}13.58%,94%{opacity:1}97%,100%{opacity:0}}.k2{animation:k2 26s linear infinite}@keyframes k3{0%,16.92%{opacity:0}17.42%,94%{opacity:1}97%,100%{opacity:0}}.k3{animation:k3 26s linear infinite}@keyframes k4{0%,22.31%{opacity:0}22.81%,94%{opacity:1}97%,100%{opacity:0}}.k4{animation:k4 26s linear infinite}@keyframes k5{0%,26.15%{opacity:0}26.65%,94%{opacity:1}97%,100%{opacity:0}}.k5{animation:k5 26s linear infinite}@keyframes k6{0%,28.08%{opacity:0}28.58%,94%{opacity:1}97%,100%{opacity:0}}.k6{animation:k6 26s linear infinite}@keyframes k7{0%,30.00%{opacity:0}30.50%,94%{opacity:1}97%,100%{opacity:0}}.k7{animation:k7 26s linear infinite}@keyframes k8{0%,38.46%{opacity:0}38.96%,94%{opacity:1}97%,100%{opacity:0}}.k8{animation:k8 26s linear infinite}@keyframes k9{0%,42.31%{opacity:0}42.81%,94%{opacity:1}97%,100%{opacity:0}}.k9{animation:k9 26s linear infinite}@keyframes k10{0%,48.46%{opacity:0}48.96%,94%{opacity:1}97%,100%{opacity:0}}.k10{animation:k10 26s linear infinite}@keyframes k11{0%,55.38%{opacity:0}55.88%,94%{opacity:1}97%,100%{opacity:0}}.k11{animation:k11 26s linear infinite}@keyframes k12{0%,59.23%{opacity:0}59.73%,94%{opacity:1}97%,100%{opacity:0}}.k12{animation:k12 26s linear infinite}@keyframes k13{0%,64.62%{opacity:0}65.12%,94%{opacity:1}97%,100%{opacity:0}}.k13{animation:k13 26s linear infinite}@keyframes k14{0%,68.46%{opacity:0}68.96%,94%{opacity:1}97%,100%{opacity:0}}.k14{animation:k14 26s linear infinite}
    @media (prefers-reduced-motion:reduce){.l{animation:none;opacity:1}}
  </style>
  <rect class="bg" width="860" height="470" rx="12"/>
  <path class="bar" d="M0 12a12 12 0 0 1 12-12h836a12 12 0 0 1 12 12v24H0z"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/><circle cx="42" cy="18" r="6" fill="#febc2e"/><circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text class="title" x="430" y="22" text-anchor="middle">shipwright: fixing a login bug</text>
  <text class="l k0 cmd" x="24" y="66" xml:space="preserve">you   Fix the 500 error on login</text>
  <text class="l k1 dim" x="24" y="96" xml:space="preserve">size S: one clear bug. Reproduce it, then fix it.</text>
  <text class="l k2 " x="24" y="130" xml:space="preserve">$ shipwright.py verify 001 -- python3 test_auth.py</text>
  <text class="l k3 good" x="24" y="152" xml:space="preserve">PASS (exit 0): python3 test_auth.py</text>
  <text class="l k4 " x="24" y="184" xml:space="preserve">$ shipwright.py mark 001 verified</text>
  <text class="l k5 bad" x="24" y="206" xml:space="preserve">REFUSED building -&gt; verified:</text>
  <text class="l k6 bad" x="24" y="228" xml:space="preserve">  - no red run recorded: test-first means a failing test before the code</text>
  <text class="l k7 bad" x="24" y="250" xml:space="preserve">  - bugfix without a real root-cause hypothesis</text>
  <text class="l k8 " x="24" y="284" xml:space="preserve">$ shipwright.py verify 001 --expect-fail -- python3 test_auth.py</text>
  <text class="l k9 warn" x="24" y="306" xml:space="preserve">RED (expected failure, exit 1): python3 test_auth.py</text>
  <text class="l k10 " x="24" y="338" xml:space="preserve">$ shipwright.py log 001 "HYPOTHESIS: login crashes because lower is called on None"</text>
  <text class="l k11 " x="24" y="370" xml:space="preserve">$ shipwright.py verify 001 -- python3 test_auth.py</text>
  <text class="l k12 good" x="24" y="392" xml:space="preserve">PASS (exit 0): python3 test_auth.py</text>
  <text class="l k13 " x="24" y="424" xml:space="preserve">$ shipwright.py mark 001 verified</text>
  <text class="l k14 good" x="24" y="446" xml:space="preserve">001-fix-the-500-error-on-login: building -&gt; verified</text>
</svg>
